# 日程生成 SOP
# 目标：将路线图拆解为每日可执行的计划

name: 日程生成
version: "1.0"
description: 从路线图出发，生成每日时间块（time-block）日程表

steps:
  - id: extract_tasks
    name: 提取待排任务
    description: 从路线图中提取当前 scope 范围内的所有任务
    prompt_template: |
      你是一个执行力教练。

      ## 路线图
      {roadmap}

      ## 当前范围
      {scope}

      请从路线图中提取 {scope} 范围内的所有任务，输出 JSON：
      {{
        "tasks": [
          {{
            "task": "任务描述",
            "phase": "所属阶段",
            "milestone": "所属里程碑",
            "priority": "high|medium|low",
            "estimated_time": "时间估算",
            "depends_on": ["依赖的其他任务（如有）"]
          }}
        ],
        "total_tasks": 0,
        "estimated_total_time": "总时间估算"
      }}
    output_fields:
      - extracted_tasks

  - id: build_schedule
    name: 生成日程表
    description: 将任务分配到每一天，考虑优先级和依赖关系
    prompt_template: |
      你是一个日程规划专家，擅长时间块（time-block）排程。

      ## 待排任务
      {extracted_tasks}

      ## 用户可用时间
      {available_time}

      请生成日程表。排程原则：
      1. **高优先级任务排在前面**
      2. **有依赖关系的任务按顺序排**
      3. **每天不超过 8 小时有效学习/工作时间**
      4. **每隔 3 天安排一个复习日**（间隔复习：回顾前几天学的内容）
      5. **每个时间块 1-3 小时**，块之间留 15 分钟休息

      请严格输出以下 JSON 格式：
      ```json
      {{
        "schedule": {{
          "total_days": 0,
          "daily_plans": [
            {{
              "day": 1,
              "date": "日期（如果能推算的话，否则写 Day 1）",
              "theme": "今天的主题（如：LangChain 基础、RAG 实战）",
              "blocks": [
                {{
                  "time": "09:00-11:00",
                  "task": "具体任务",
                  "type": "learn|practice|review|project",
                  "priority": "high|medium|low"
                }}
              ],
              "total_hours": 6,
              "notes": "备注（如有）"
            }}
          ]
        }}
      }}
      ```

      type 说明：
      - learn：学习新知识
      - practice：练习/刷题
      - review：间隔复习（回顾前几天的内容）
      - project：做项目
    output_fields:
      - schedule
