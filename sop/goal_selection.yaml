name: 目标选择
version: "1.0"
description: 用户没有明确职业目标时，通过对话帮助探索并选定方向。三轴定位：能力轴（have）× 兴趣轴（对话挖掘）× 市场轴（真实岗位数据）

methodology:
  principles:
    - "核心是引导而非代劳：教练不替用户做决定（选择即承诺）——给方向、给依据、给对比，最终选择权在用户"
    - "三轴定位：能力（用户会什么）× 兴趣（用户想做什么）× 市场（真实岗位要什么）——三者交集是候选方向；市场轴必须用 fetch_company_jobs 的真实数据，绝不凭 LLM 知识编造'热门方向'"
    - "主动给候选，不要空等：用户没方向时，基于能力+兴趣+市场先给出 2-3 个候选方向，并标注假设（如'假设你愿意学编程'），让用户纠正——比开放式追问'你想做什么'更高效"
    - "每个候选方向必须带 Fit Filters：适合信号（什么特征的人适合）+ 否决信号（什么情况不适合），让用户能自我对照"
    - "如实反映现状：用户是零基础小白就明确记录 experience_level=零基础、skills 留空，绝不美化；候选方向要标注该方向对零基础的友好度（门槛高/中/低）"
    - "不做死板测评：不套用霍兰德/MBTI 问卷题，用对话提问 + 真实岗位数据驱动"
    - "落定即衔接：用户选定方向后，用 intake(section='want') 写入档案，然后走正常差距分析流程（analyze_gaps）"

  phases:
    - id: probe_reality
      name: 摸排现状与约束
      guidance: |
        基于档案已有信息（who/have），通过对话补齐目标选择所需的三个维度：

        1. 能力轴（已有）：读取 have——技能、经历、教育、能力证据。用户是零基础就如实标注。
           **若 have 技能无 user_verified 标记（可能来自简历导入），先逐项求证技能**（摸排是
           硬性必选，BUG-001）：项目是不是你独立写的？讲一个难点？实际掌握到什么程度？
           confidence 自标不算证据；最终 finalize_profile 会硬门禁阻塞，
           仅当 skills 为空（真零基础）才跳过技能追问，转而问软性约束。
        2. 兴趣轴（对话挖掘，3-5 个问题足矣，不啰嗦）：
           - "不考虑现实限制，你理想中的工作状态是什么样的？"（Genie Goal 式提问）
           - "平时做什么事容易进入心流/废寝忘食？"
           - "有没有羡慕过的职业或佩服的人？为什么？"
           - "对哪些行业有感觉，哪些明确排斥？"
           - 用 3W 追问（What-Why-How）挖深回答
        3. 约束轴（对话挖掘）：
           - 学历/城市/可投入时间/薪资底线（仅理解目标，不用于排期）
           - 明确的不愿意项（如"不想写代码""不想加班""不想销售"）

        注意：这是对话不是审问，一次问 2-3 个，顺着用户回答往下走。
      data_needs:
        - type: user_profile
          query_hint: "从 profile.have 中获取能力现状，从 profile.who 中获取身份背景"
          local_paths: []
      quality_gate: "已掌握用户能力轴、兴趣倾向、关键约束三个维度（允许某维度暂缺，标注为待确认假设）"

    - id: gather_market
      name: 获取市场真实方向
      guidance: |
        用真实岗位数据支撑候选方向，绝不用 LLM 知识编造市场信息：

        - list_data_sources 查看可用企业 → get_scraper_guide 读取用法
        - 按用户兴趣/约束倾向，用 fetch_company_jobs 抓 1-3 个方向的关键词岗位
          （如用户对 AI 有兴趣就搜 "AI"，对运营有兴趣就搜 "运营"，零基础用户搜入门门槛低的岗位）
        - 关注：岗位真实存在（不是臆想）、薪资范围、对经验的要求（判断零基础是否可入）
        - 结果自动写入知识库，后续差距分析可复用
      data_needs:
        - type: job_market
          query_hint: "按用户兴趣轴/约束轴确定关键词，抓取真实岗位"
          local_paths: ["jds/", "interviews/"]
      quality_gate: "候选方向必须有真实岗位数据支撑；抓取失败就如实说明，不编造"

    - id: propose_directions
      name: 提出候选方向
      guidance: |
        基于三轴信息，给出 2-3 个候选方向（不要超过 3 个，避免选择困难）。每个方向：

        1. 名称与一句话定位（如"AI 应用开发——用大模型做产品"）
        2. 依据：为什么提这个方向（来自哪根轴——用户兴趣/能力/市场数据）
        3. 标注假设：哪些判断是假设（如"假设你愿意学编程"），让用户确认或纠正
        4. Fit Filters：
           - 适合信号：什么样的人适合（兴趣点、性格、能力）
           - 否决信号：什么情况不适合（明确排斥项、门槛超出现状）
        5. 零基础友好度：高/中/低 + 入门路径一句话
        6. 市场依据摘要：真实岗位数据（岗位名、薪资范围、经验要求）

        呈现为清晰的对比，让用户能对照自己判断。
      data_needs: []
      quality_gate: "2-3 个方向，每个含依据+假设+Fit Filters+市场数据摘要；零基础用户明确标注门槛"

    - id: decide
      name: 引导选择并落定
      guidance: |
        与用户逐项对比候选方向（决策平衡单：兴趣匹配/能力差距/学习成本/市场需求/薪资前景），
        但不代劳决定：

        - 用打分引导：让用户对每个方向打 1-10 分的"想选指数"，低分追问阻碍因素
        - 用户选定后，用 intake(section='want', data=...) 把目标写入档案，字段建议：
          target_role（目标岗位/方向）、interest（兴趣依据）、constraints（约束）、
          direction_confidence（用户选择置信度 1-10）、experience_level（如实标注，零基础写零基础）
        - 提醒用户：方向选定后可走 analyze_gaps 差距分析；如果执行中发现方向不对，
          随时可以回来重新 explore_goals（顺序归产品，选择归用户）
      data_needs: []
      quality_gate: "want 已写入档案且如实反映用户水平；用户明确做出选择（不是教练替他选）"

  output_schema:
    candidates: |
      候选方向列表（对话中呈现，不落盘），每项：
      - name: 方向名称
      - positioning: 一句话定位
      - basis: 提出依据（能力/兴趣/市场哪根轴）
      - assumptions: 标注的假设清单
      - fit_filters: { fit_signals: [], dealbreakers: [] }
      - beginner_friendly: 高/中/低
      - market: 真实岗位数据摘要（岗位名/薪资/经验要求）
    selected_direction: |
      用户选定方向（经 intake 写入 want）：
      - target_role, interest, constraints, direction_confidence, experience_level
      注意：experience_level 必须如实反映，零基础就是零基础，不美化