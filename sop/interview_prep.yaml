name: 面试通过
version: "2.0"
description: 从面经搜集、高频题归纳、针对性准备三个维度帮助用户系统性准备面试

methodology:
  principles:
    - "面试题有明确分类：八股文、项目深挖、系统设计、行为面、算法——每类有不同准备策略"
    - "能力匹配是核心——先评估用户当前水平，再针对性补强，避免无效准备"
    - "STAR 法则是项目深挖题的万能框架，每个项目故事都要练到脱口而出"
    - "间隔复习比突击有效——面试准备要有节奏感，不能一次性灌输"
    - "面试流程因公司而异——了解目标公司的面试轮次和侧重，才能有的放矢"

  phases:
    - id: gather_data
      name: 数据收集
      guidance: |
        先确定候选人画像（背景、经验、目标岗位、目标公司），再从两个维度检索：
        1. 面经——目标公司/岗位的真实面试经验（几轮、问什么、难度）
        2. 面试题——岗位相关的高频面试题（按技术栈分类）
        画像决定检索方向，面经提供面试流程信息，面试题提供具体内容。
      data_needs:
        - type: interview_experiences
          query_hint: "{target_company} {target_role} 面试 面经"
          local_paths: ["interviews/"]
        - type: interview_questions
          query_hint: "{target_role} 技术面试题 高频 {experience_level}"
          local_paths: ["interviews/"]
      quality_gate: "面经覆盖目标公司，面试题数量足够分类统计"

    - id: analyze_interview
      name: 面试分析
      guidance: |
        分两步分析：
        第一步——题目分类统计：
        - 八股文：基础知识、原理性问题
        - 项目深挖：针对简历项目的追问
        - 系统设计：架构设计题
        - 行为面：软技能、团队协作
        - 算法：手撕代码、算法题
        标注每类题的出现频率和面试流程（几轮、每轮侧重）。

        第二步——能力匹配：
        - 用户能答好的题 → 强化建议（如何答得更好）
        - 用户答不好的题 → 补课清单（学习建议）
        - 用户完全不会的题 → 优先级评估（风险等级 + 准备建议）
      data_needs:
        - type: user_have
          query_hint: "从 profile 中获取"
          local_paths: []
      quality_gate: "五类题目均有覆盖，能力匹配有明确的强/弱/盲区划分"
      depends_on: [gather_data]

    - id: generate_preparation
      name: 生成面试准备方案
      guidance: |
        基于分析结果，给出系统性的面试准备方案。必须包含：
        1. 必考题清单——按类型和优先级排列，每个给具体准备建议和时间估算
        2. 项目深挖准备——每个项目列出可能被问的问题、回答要点、STAR 故事框架
        3. 系统设计专题——答题框架提示
        4. 行为面试准备——常见问题 + 故事模板（什么场景用什么故事）
        5. 学习计划——按周拆分，每周有明确的学习内容
        方案要可执行，时间估算要现实。
      data_needs:
        - type: user_have
          query_hint: "从 profile 中获取"
          local_paths: []
      quality_gate: "每个项目有 STAR 故事框架，学习计划按周拆分且内容具体"
      depends_on: [analyze_interview]

  output_schema:
    must_prepare: "必考题清单（主题、类型、优先级、准备建议、时间估算）"
    project_deep_dive: "项目深挖准备（项目名、可能问题、要点、STAR 故事）"
    system_design_topics: "系统设计专题（题目、答题框架）"
    behavioral_questions: "行为面试准备（问题、故事模板）"
    study_plan: "学习计划（按周拆分，每周具体内容）"
