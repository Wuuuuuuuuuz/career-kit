name: 路线图生成
version: "2.0"
description: 从差距分析出发，生成可执行的分阶段职业路线图，每阶段有量化指标和简历价值

methodology:
  principles:
    - "阶段类型决定产出：learn 打基础（通常无简历价值），project/intern/research 落简历（必须有 resume_value）"
    - "KPI 必须可量化——不能是'学会'这种模糊表述，要有数字、有证据"
    - "里程碑拆分要现实——每个里程碑有明确交付物和完成标准"
    - "任务粒度到天——每个 task 是一天内可完成的，时间估算要考虑用户基础水平"
    - "善于建议高价值活动：开源 PR、黑客马拉松、技术博客——这些都能归入 project 类型"
    - "市场数据驱动设计——用真实 JD 中的技能要求来决定学什么、做什么"

  phases:
    - id: gather_market_data
      name: 检索市场数据
      guidance: |
        搜索目标岗位的真实 JD 和市场信息，为路线图设计提供数据支撑。
        关注：目标岗位需要哪些技能、市场上的热门技术栈、岗位要求的项目经验类型。
        这些数据决定了路线图中学什么、做什么、优先级如何排列。
      data_needs:
        - type: job_requirements
          query_hint: "{target_role} {target_company} 岗位要求 技能"
          local_paths: ["jds/", "market/"]
      quality_gate: "获取到足够数量的 JD 数据，能归纳出核心技能要求"

    - id: design_roadmap
      name: 设计路线图
      guidance: |
        LLM 动态设计阶段划分、KPI、里程碑、每日任务。分两步：

        第一步——差距提取：
        - 需要弥补的技能（按优先级排序，标注当前水平和目标水平）
        - 需要创造的经历（项目/实习/研究等）
        - 时间约束（可用时间、deadline）
        - 起点评估（当前水平总结）

        第二步——路线图设计：
        阶段类型说明：
        - learn（学习技能）：刷题、学框架、考认证、看文档、跟教程。resume_value 通常为空。
        - project（做项目）：独立项目、开源贡献、黑客马拉松、技术博客。必须有 resume_value。
        - intern（实习）：公司实习、远程实习、兼职。必须有 resume_value。
        - research（研究）：发论文、做课题、参与实验室项目。必须有 resume_value。

        设计原则：
        1. 阶段顺序由 LLM 根据实际情况决定，没有固定模式
        2. learn 阶段通常在最前面，为后续阶段打基础
        3. 每个阶段必须有量化指标（KPI）
        4. project/intern/research 阶段必须有 resume_value
        5. 每个阶段拆成 2-3 个里程碑
        6. 每个里程碑拆成具体任务，粒度到天
        7. 任务时间估算要考虑用户基础水平
      data_needs:
        - type: gap_summary
          query_hint: "从 profile.gap 中获取"
          local_paths: []
        - type: user_have
          query_hint: "从 profile 中获取"
          local_paths: []
        - type: user_want
          query_hint: "从 profile 中获取"
          local_paths: []
      quality_gate: "每个阶段有 KPI 和 resume_value（learn 类型除外），任务粒度到天"
      depends_on: [gather_market_data]

  output_schema:
    total_duration: "总时长（如：3个月）"
    strategy_summary: "整体策略说明（一段话）"
    phases: |
      阶段列表，每阶段包含：
      - id, type, name, duration, goal
      - kpi: { metric, target, evidence }
      - resume_value: 如何写到简历上
      - milestones: { id, name, duration, tasks[], deliverable, done_criteria }
      每个 task 包含：task, time, priority
