# 企业 JD Scraper 注册表
#
# 添加新企业：
# 1. 在 scrapers/ 下新建目录，实现 CompanyScraper
# 2. 在此文件注册
# 3. PR 提交
#
# 字段说明：
#   name: 企业名称（显示用）
#   module: Python 模块路径（相对于 src/scrapers/）
#   class: Scraper 类名（默认 Scraper）
#   description: 企业描述（可选）
#   params: 支持的搜索参数（可选，供 LLM 参考）

scrapers:
  bytedance:
    name: 字节跳动
    module: bytedance.scraper
    class: Scraper
    description: 字节跳动官方招聘（jobs.bytedance.com），支持社招/校招
    url_patterns:
      - "jobs.bytedance.com"
    params:
      keyword:
        description: 搜索关键词（如 "Python"、"AI Agent"）
        required: false
      city:
        description: 城市名（如 "北京"、"上海"、"深圳"）
        required: false
      job_type:
        description: 岗位类别（研发/运营/产品/销售/设计/市场/游戏策划/教研教学）
        required: false
      portal:
        description: "experienced=社招(默认), campus=校招"
        required: false
      limit:
        description: 返回数量上限，默认 20
        required: false
