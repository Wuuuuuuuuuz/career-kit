[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-kit"
version = "0.1.0"
description = "MCP server for AI-powered career planning — profile, gap analysis, roadmap, schedule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0",
    "iv8",
    # 反检测 fork，驱动层消除 Runtime.enable 泄漏（BOSS 登录必需）。
    # 必须锁死版本：上游重构可能导致静默失效
    "patchright==1.62.1",
]

[project.scripts]
career-kit = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
