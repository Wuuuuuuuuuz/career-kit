[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-kit"
version = "0.1.0"
description = "MCP server for AI-powered career planning — profile, gap analysis, roadmap, schedule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0",
]

[project.scripts]
career-kit = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
